[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "browzarr"
version = "0.1.0"
description = "Local-server launcher for the Browzarr Earth science visualization app"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Jeran Poehls" }
]
dependencies = ["pywebview>=5.0", "xarray"]

[project.scripts]
browzarr = "browzarr:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
browzarr_viewer = ["web/dist/**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["web/dist/.gitkeep"]
